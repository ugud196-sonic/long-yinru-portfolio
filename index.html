<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龙胤茹的影像漫游。沿着光，走过摄影与设计，走进视频作品。"><title>龙胤茹作品集</title><link rel="stylesheet" href="style.css"></head><body>
<div id="galleryIntro" role="status"><span>龙胤茹作品集</span></div>
<header><nav aria-label="空间导航"><button id="galleryNav" class="active">作品长廊</button><button id="cinemaNav">视频作品</button></nav><button id="accountsNav">账号运营</button><button id="catalog">全部作品 ↗</button></header>
<main id="experience"><div class="chapter"><span class="eyebrow" id="eyebrow">A WALK THROUGH LIGHT</span><h1 id="chapterTitle">光影之间</h1><p id="chapterText">沿着光，慢慢走。每一幅，都值得停留。</p></div>
<div id="viewport" aria-label="连续作品长廊"><div class="scene" id="scene"><div class="world" id="world"><div class="longwall"></div><div class="floor"></div><div class="ceiling"></div><div id="paintings"></div><section id="cinema" aria-label="视频作品"><div class="curtain left"></div><div class="curtain right"></div><div class="screen-glow"></div><div class="screen"><video id="film" playsinline preload="metadata" controls></video><button id="playFilm" aria-label="开始放映"><span>▶</span><small>开始放映</small></button></div><div class="screen-caption"><span id="filmTitle"></span><span>NOW SHOWING</span></div><div class="seats" aria-hidden="true"></div></section></div></div></div>
<div class="edge-shade"></div><div id="inspectHint">拖动查看设备 · 点击“返回观展”退出</div><div class="filmstrip" id="filmstrip" aria-label="选择影片" hidden></div><div id="projectionControls" hidden><span id="projectionTitle"></span><button id="projectionPlay">播放</button><input id="projectionSeek" type="range" min="0" max="100" value="0" step=".1" aria-label="播放进度"><span id="projectionTime">0 / — 秒</span><button id="projectionMute">静音</button><button id="inspectDevice">查看设备</button></div><div class="journey"><div><span id="position">01 / 06</span><p id="hint">点击作品靠近观看</p></div><div id="stops" aria-label="漫游位置"></div><div class="arrows"><button id="prev" aria-label="向前漫游">←</button><button id="next">继续漫游 <span>→</span></button></div></div></main>
<footer><span id="location" aria-live="polite">摄影与设计 · 一段连续的旅程</span><button id="fullscreen">全屏沉浸 ⛶</button></footer>
<dialog id="viewer" aria-label="作品细节"><div class="viewer-top"><span id="workCount"></span><button id="closeViewer">返回长廊 ✕</button></div><div id="media"></div><div class="viewer-bottom"><div><small id="workType"></small><h2 id="workTitle"></h2></div><div><button id="workPrev" aria-label="上一件作品">←</button><button id="workNext" aria-label="下一件作品">→</button></div></div></dialog>
<dialog id="directory"><div class="directory-head"><div><h2>全部作品</h2></div><button id="closeDirectory">关闭 ✕</button></div><div id="grid"></div></dialog><script src="works.js"></script><script src="app.js"></script><script src="gallery.js" type="module"></script></body></html>
